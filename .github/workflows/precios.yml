name: Precios de Trick or Trade

# Una vez al día (después de que tcgcsv y Cardmarket publiquen los suyos) y a mano desde la pestaña Actions
on:
  schedule:
    - cron: "40 21 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/precios.py"
      - ".github/workflows/precios.yml"
      - "precios/tot-cartas.json"

permissions:
  contents: write

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar precios
        run: python3 .github/scripts/precios.py
      - name: Guardar
        run: |
          git config user.name "GotchaDex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precios
          git diff --cached --quiet || (git commit -m "Precios del día" && git pull --rebase -q && git push)
